name: Send emails daily
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

concurrency:
  group: send-emails-daily
  cancel-in-progress: false

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          ARXIV_QUERY: ${{ secrets.ARXIV_QUERY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
          LLM_USER_AGENT: ${{ secrets.LLM_USER_AGENT }}
          LANGUAGE: ${{ vars.LANGUAGE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          echo "Use custom config: "
          cat config/custom.yaml
          uv run src/zotero_arxiv_daily/main.py

      - name: Report failure
        if: failure() || cancelled()
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import os, smtplib, ssl
          from email.mime.text import MIMEText

          run_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          reason = os.environ.get("FAILURE_REASON", "unknown")
          body = f"The 'Send emails daily' workflow run did not complete ({reason}).\n\nRun: {run_url}"
          msg = MIMEText(body)
          msg["Subject"] = "[zotero-arxiv-daily] daily run did not complete"
          msg["From"] = os.environ["SENDER"]
          msg["To"] = os.environ["RECEIVER"]
          ctx = ssl.create_default_context()
          host = os.environ["SMTP_SERVER"]
          port = int(os.environ["SMTP_PORT"])
          s = None
          try:
              s = smtplib.SMTP(host, port, timeout=30)
              s.starttls(context=ctx)
          except Exception:
              if s is not None:
                  try:
                      s.close()
                  except Exception:
                      pass
              try:
                  s = smtplib.SMTP_SSL(host, port, context=ctx, timeout=30)
              except Exception:
                  s = smtplib.SMTP(host, port, timeout=30)
          try:
              s.login(os.environ["SENDER"], os.environ["SENDER_PASSWORD"])
              s.send_message(msg)
          finally:
              try:
                  s.quit()
              except Exception:
                  pass
          print("Failure notification sent to", os.environ["RECEIVER"])
          EOF
