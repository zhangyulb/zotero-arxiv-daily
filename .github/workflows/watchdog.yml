name: Schedule watchdog
on:
  workflow_dispatch:
  schedule:
    # Runs 5h after the daily cron (0 22 * * *), safely after the 150m job timeout
    # and typical GitHub Actions schedule queue delays. If the last 24h run is missing
    # or failed, this fails loudly and emails the receiver.
    - cron: '0 3 * * *'

jobs:
  check-daily-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check today's run exists and succeeded
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PYTHONPATH=src python3 -m zotero_arxiv_daily.watchdog check
